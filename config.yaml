  out_test_preds:      "outputs/phase3_hybrid/metrics/phase3_test_predictions.csv"
  out_curves_plot:     "outputs/phase3_hybrid/plots/phase3_training_curves.png"
  out_cm_plot:         "outputs/phase3_hybrid/plots/phase3_confusion_matrix.png"
